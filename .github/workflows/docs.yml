name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build rustdoc (all features)
        run: |
          cargo doc \
            --no-deps \
            --all-features
        env:
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options --default-theme=ayu"

      # Add a redirect from the root so GitHub Pages lands on the crate index.
      - name: Add root redirect
        run: |
          cat > target/doc/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=llm_agent_runtime/index.html" />
            </head>
            <body>
              <p><a href="llm_agent_runtime/index.html">Redirecting…</a></p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
