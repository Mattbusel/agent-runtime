name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # ── Format check ─────────────────────────────────────────────────────────
      - name: Check formatting
        run: cargo fmt --all -- --check

      # ── Lint (all feature combinations) ──────────────────────────────────────
      - name: Clippy (no features)
        run: cargo clippy --no-default-features -- -D warnings

      - name: Clippy (orchestrator only)
        run: cargo clippy --no-default-features --features orchestrator -- -D warnings

      - name: Clippy (memory only)
        run: cargo clippy --no-default-features --features memory -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings

      # ── Tests (all feature combinations) ─────────────────────────────────────
      - name: Test (default features)
        run: cargo test

      - name: Test (no features)
        run: cargo test --no-default-features

      - name: Test (orchestrator only)
        run: cargo test --no-default-features --features orchestrator

      - name: Test (memory only)
        run: cargo test --no-default-features --features memory

      - name: Test (persistence feature)
        run: cargo test --features persistence

      - name: Test (providers feature)
        run: cargo test --features providers

      - name: Test (all features)
        run: cargo test --all-features

      # ── Documentation ─────────────────────────────────────────────────────────
      - name: Doc (all features, no deps)
        run: cargo doc --no-deps --all-features

      - name: Doc (all features, no deps, private items)
        run: cargo doc --no-deps --document-private-items --all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-tarpaulin --locked
      - run: cargo tarpaulin --out Xml --engine llvm --all-features
      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - run: cargo build --all-features
