name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Format + Lint + Test ──────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # ── Format check ───────────────────────────────────────────────────────
      - name: Check formatting
        run: cargo fmt --all -- --check

      # ── Clippy (all feature combinations) ─────────────────────────────────
      - name: Clippy (no features)
        run: cargo clippy --no-default-features -- -D warnings

      - name: Clippy (orchestrator only)
        run: cargo clippy --no-default-features --features orchestrator -- -D warnings

      - name: Clippy (memory only)
        run: cargo clippy --no-default-features --features memory -- -D warnings

      - name: Clippy (persistence feature)
        run: cargo clippy --features persistence -- -D warnings

      - name: Clippy (providers feature)
        run: cargo clippy --features providers -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings

      # ── Tests (all feature combinations) ──────────────────────────────────
      - name: Test (default features)
        run: cargo test

      - name: Test (no features)
        run: cargo test --no-default-features

      - name: Test (orchestrator only)
        run: cargo test --no-default-features --features orchestrator

      - name: Test (memory only)
        run: cargo test --no-default-features --features memory

      - name: Test (persistence feature)
        run: cargo test --features persistence

      - name: Test (providers feature)
        run: cargo test --features providers

      - name: Test (all features)
        run: cargo test --all-features

      # ── Documentation build ────────────────────────────────────────────────
      - name: Doc (all features, no deps)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Doc (all features, private items)
        run: cargo doc --no-deps --document-private-items --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      # ── Release build (verify optimized compilation) ──────────────────────
      - name: Release build (default features)
        run: cargo build --release

      - name: Release build (all features)
        run: cargo build --release --all-features

  # ── Security Audit ────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit

  # ── Code Coverage ─────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Collect coverage
        run: cargo tarpaulin --out Xml --engine llvm --all-features

      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  # ── MSRV Check ────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (Rust 1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.75

      - uses: Swatinem/rust-cache@v2

      - name: Build on MSRV
        run: cargo build --all-features
